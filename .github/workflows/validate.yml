name: Validate skills

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate every skill structure
        run: python3 scripts/validate_skills.py
      - name: Test clean local installations
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r skill; do
            test_home="$(mktemp -d)"
            HOME="$test_home" npx -y skills@latest add "$PWD" \
              --skill "$skill" --global --copy --yes
            installed="$(find "$test_home" -type f -path "*/skills/$skill/SKILL.md" -print -quit)"
            test -n "$installed"
            skill_root="$(dirname "$installed")"
            diff -qr "skills/$skill" "$skill_root"
            rm -rf "$test_home"
          done < <(find skills -mindepth 1 -maxdepth 1 -type d -exec basename {} \; | sort)

  anonymous-install:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Discover and install every skill anonymously
        shell: bash
        env:
          GH_TOKEN: ""
          GITHUB_TOKEN: ""
        run: |
          set -euo pipefail
          public_copy="$(mktemp -d)"
          trap 'rm -rf "$public_copy"' EXIT
          GIT_TERMINAL_PROMPT=0 git -c credential.helper= clone --quiet --depth 1 \
            https://github.com/onurmatik/skills.git "$public_copy/repo"
          npx -y skills@latest add onurmatik/skills --list
          while IFS= read -r skill; do
            test_home="$(mktemp -d)"
            HOME="$test_home" GH_TOKEN="" GITHUB_TOKEN="" \
              npx -y skills@latest add onurmatik/skills \
              --skill "$skill" --global --copy --yes
            installed="$(find "$test_home" -type f -path "*/skills/$skill/SKILL.md" -print -quit)"
            test -n "$installed"
            skill_root="$(dirname "$installed")"
            diff -qr "$public_copy/repo/skills/$skill" "$skill_root"
            rm -rf "$test_home"
          done < <(find "$public_copy/repo/skills" -mindepth 1 -maxdepth 1 -type d -exec basename {} \; | sort)
